service: serverless-todos

provider:
  name: aws
  runtime: nodejs22.x
  region: ap-south-1
  memorySize: 256
  timeout: 10
  logRetentionInDays: 7
  environment:
    TABLE_NAME: ${self:service}-${sls:stage}
    JWT_SECRET: ${env:JWT_SECRET}
    DEMO_EMAIL: ${env:DEMO_EMAIL}
    DEMO_PASSWORD: ${env:DEMO_PASSWORD}
  httpApi:
    cors:
      allowedOrigins:
        - http://localhost:5173
        - https://serverless-todos-pi.vercel.app
      allowedHeaders: [Content-Type, Authorization]
      allowedMethods: [GET, POST, PATCH, DELETE, OPTIONS]
    authorizers:
      jwtAuth:
        type: request
        functionName: authorizer
        identitySource:
          - $request.header.Authorization
        enableSimpleResponses: true
        resultTtlInSeconds: 300
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:PutItem
            - dynamodb:UpdateItem
            - dynamodb:DeleteItem
            - dynamodb:Query
          Resource: !GetAtt TodosTable.Arn

functions:
  authorizer:
    handler: src/handlers/authorizer.handler

  login:
    handler: src/handlers/login.handler
    events:
      - httpApi: { path: /auth/login, method: post }

  listTodos:
    handler: src/handlers/list.handler
    events:
      - httpApi:
          path: /todos
          method: get
          authorizer: { name: jwtAuth }

  createTodo:
    handler: src/handlers/create.handler
    events:
      - httpApi:
          path: /todos
          method: post
          authorizer: { name: jwtAuth }

  updateTodo:
    handler: src/handlers/update.handler
    events:
      - httpApi:
          path: /todos/{id}
          method: patch
          authorizer: { name: jwtAuth }

  deleteTodo:
    handler: src/handlers/delete.handler
    events:
      - httpApi:
          path: /todos/{id}
          method: delete
          authorizer: { name: jwtAuth }

resources:
  Resources:
    TodosTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:service}-${sls:stage}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - { AttributeName: PK, AttributeType: S }
          - { AttributeName: SK, AttributeType: S }
        KeySchema:
          - { AttributeName: PK, KeyType: HASH }
          - { AttributeName: SK, KeyType: RANGE }
